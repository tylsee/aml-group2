# P1 round 2, variant: p1b_base plus stronger augmentation, so the model leans less on background and leaf shape.
name: p1b_aug
pretrained: true
train_csv: train_fit
batch_size: 32
views: 1
epochs: 12
alpha: 0.0
beta: 0.0
tau: 0.07
optim:
  lr_backbone: 1.0e-4
aug:
  crop_scale_min: 0.5   # Baseline 1: 0.85
  rotation: 20          # Baseline 1: 10
  brightness: 0.3       # Baseline 1: 0.15
  contrast: 0.3         # Baseline 1: 0.15
  saturation: 0.3       # Baseline 1: 0
  hue: 0.05             # Baseline 1: 0
