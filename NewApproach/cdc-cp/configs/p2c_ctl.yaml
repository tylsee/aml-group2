# P2c control: ConvNeXt-Tiny, head [256] GELU, no SupCon. Baseline for the shortcut rate.
name: p2c_ctl
pretrained: true
train_csv: train_fit
batch_size: 16
views: 2
epochs: 10       # 431 applied updates per epoch, 4,310 in total
alpha: 0.0
beta: 0.0
tau: 0.07
optim:
  lr_backbone: 1.0e-4
model:
  backbone: convnext_tiny
  hidden: [256]
  activation: gelu
