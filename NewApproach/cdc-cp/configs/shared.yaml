# Values agreed in the team plan. Run-specific overrides belong in a run config, not here.
seed: 42

paths:
  data_root: "C:/swinburne/2026_Y3S2/COS300082 AML/Assignment/MLProject/DPD_Small"  # override with env DPD_ROOT
  image_subdir: DPD_Small_dataset   # folder inside data_root that holds the images
  splits_dir: data/splits_v2
  catalogue_dev: data/mappings/catalogue_dev.json
  catalogue_final: data/mappings/catalogue_final.json
  cache_dir: runs/cache
  runs_dir: runs

model:
  crop_classes: 55
  disease_classes: 175
  dropout: 0.2

optim:
  lr_backbone: 1.0e-5   # team default; P1 E2 tests 1.0e-4
  lr_heads: 1.0e-3      # best in Baseline 1's learning-rate tests
  weight_decay: 1.0e-4  # higher values did not help Baseline 1
  warmup_epochs: 1      # linear warm-up of all groups over the first epoch, then per-update cosine to zero

loader:
  num_workers: 4
  eval_batch: 64

bn:
  subset: 2048
  batch: 100

amp: true
max_skip_fraction: 0.01
