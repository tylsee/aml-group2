# P1 round 2, control: backbone 1e-4 (both seeds beat 1e-5 on seen accuracy in round 1) and 12 epochs
# (validation disease loss was lowest at epochs 5-6 at 1e-4, then rose). Augmentation and loss as round 1.
# Run with seed 42 and seed=43. Variants p1b_aug and p1b_ls each change one thing from this file.
name: p1b_base
pretrained: true
train_csv: train_fit
batch_size: 32
views: 1
epochs: 12       # 2,580 applied updates; the first 215 are warm-up
alpha: 0.0
beta: 0.0
tau: 0.07
optim:
  lr_backbone: 1.0e-4
