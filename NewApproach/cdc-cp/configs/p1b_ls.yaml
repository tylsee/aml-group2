# P1 round 2, variant: p1b_base plus label smoothing 0.1 on both cross-entropies, to reduce over-confidence.
# Note: train_ce_* in history.csv is then the smoothed loss; val_ce_* stays plain cross-entropy.
name: p1b_ls
pretrained: true
train_csv: train_fit
batch_size: 32
views: 1
epochs: 12
alpha: 0.0
beta: 0.0
tau: 0.07
label_smoothing: 0.1
optim:
  lr_backbone: 1.0e-4
