# P2c cross + spy: p2c_cross plus a crop adversary on the disease embedding through gradient reversal (weight 0.1).
name: p2c_cross_spy
pretrained: true
train_csv: train_fit
batch_size: 16
views: 2
epochs: 10       # 431 applied updates per epoch, 4,310 in total
alpha: 0.1
beta: 0.1
tau: 0.07
optim:
  lr_backbone: 1.0e-4
model:
  backbone: convnext_tiny
  hidden: [256]
  activation: gelu
contrast: cross
memory:
  per_pair: 2
  start_epoch: 1
spy:
  weight: 0.1
