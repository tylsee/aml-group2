# P2c plain: crop and disease SupCon (alpha=beta=0.1), same-label positives from any crop in the batch, no memory.
name: p2c_plain
pretrained: true
train_csv: train_fit
batch_size: 16
views: 2
epochs: 10       # 431 applied updates per epoch, 4,310 in total
alpha: 0.1
beta: 0.1
tau: 0.07
optim:
  lr_backbone: 1.0e-4
model:
  backbone: convnext_tiny
  hidden: [256]
  activation: gelu
contrast: plain
