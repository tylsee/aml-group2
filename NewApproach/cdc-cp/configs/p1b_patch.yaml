# Teacher's tip (2026-11-18): p1b_base plus patch shuffle. Half the training images are cut into a 4 x 4 grid (56 px tiles) and
# the tiles are put back in random order, so the model reads the disease spots, not the leaf shape. The grid stays
# coarse enough that the spots stay readable (grid 2 kept the leaf outline, grid 7 was too scrambled:
# reports/patch_shuffle_grids.jpg). Everything else equals p1b_base.
name: p1b_patch
pretrained: true
train_csv: train_fit
batch_size: 32
views: 1
epochs: 12       # 2,580 applied updates; the first 215 are warm-up
alpha: 0.0
beta: 0.0
tau: 0.07
optim:
  lr_backbone: 1.0e-4
aug:
  patch_grid: 4
  patch_p: 0.5
